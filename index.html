<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, Render!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="doodle-bg"></canvas>

  <main class="card">
    <div class="blob"></div>
    <h1>Hello, World! <span class="wave">👋</span></h1>
    <p class="subtitle">A tiny static site, deployed on <strong>Render</strong>.</p>

    <button id="mood-btn">Click for a doodle mood</button>
    <p id="mood-text" class="mood-text"></p>

    <div class="counter">
      <button id="dec">−</button>
      <span id="count">0</span>
      <button id="inc">+</button>
    </div>

    <div class="backend-status">
      <span id="backend-dot" class="dot-indicator"></span>
      <span id="backend-text">checking backend…</span>
    </div>

    <section class="guestbook">
      <h2>Guestbook <span class="visit-badge">👀 <span id="visit-count">–</span> visits</span></h2>

      <form id="guestbook-form">
        <input id="gb-name" type="text" placeholder="Your name (optional)" maxlength="40">
        <textarea id="gb-message" placeholder="Leave a note…" maxlength="280" required></textarea>
        <button type="submit">Sign guestbook</button>
      </form>
      <p id="gb-error" class="gb-error"></p>

      <ul id="guestbook-list" class="guestbook-list"></ul>
    </section>

    <footer>
      <span id="clock">--:--:--</span>
      <span class="dot">•</span>
      <span>Made with ☕ and pure HTML/CSS/JS</span>
      <span class="dot">•</span>
      <span>v1.1</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
